<main class="page"><h1>配送ポリシー</h1>
<h2>送料</h2><p>全国一律880円（税込）です。1回のご注文金額が30,000円（税込）以上の場合は送料無料です。</p>
<h2>発送時期</h2><p>決済確認後、原則2～5営業日以内に発送します。予約商品・取り寄せ商品など、商品ページに個別の発送予定を表示している場合は、その表示を優先します。</p>
<h2>高額商品</h2><p>高額商品は、追跡可能な配送方法を基本とし、商品の内容に応じて補償や受取確認が可能な方法を利用します。</p>
<h2>配送先について</h2><p>ご注文時に入力された配送先へ発送します。発送後の住所変更には対応できない場合があります。</p>
